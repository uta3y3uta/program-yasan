<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>プログラム屋さん</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234DABF7'/%3E%3Crect x='24' y='22' width='52' height='14' rx='7' fill='white'/%3E%3Crect x='24' y='43' width='40' height='14' rx='7' fill='white'/%3E%3Crect x='24' y='64' width='30' height='14' rx='7' fill='white'/%3E%3C/svg%3E" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#eef2f7; --panel:#ffffff; --ink:#2b3445; --muted:#8a94a6;
    --line:#e6eaf0; --hour:#c7d0dc; --accent:#4DABF7; --accent-d:#2f8de0;
    --shadow:0 6px 20px rgba(40,60,90,.10); --shadow-s:0 2px 6px rgba(40,60,90,.12);
    --fscale:1;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    -webkit-user-select:none; user-select:none; overflow:hidden;
  }
  /* ---------- Top bar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:60px; z-index:40;
    display:flex; align-items:center; gap:8px; padding:0 12px;
    background:var(--panel); box-shadow:var(--shadow); overflow-x:auto;
  }
  .ptitle{
    font-size:15px;font-weight:800;color:var(--ink);border:none;background:#f3f5f9;border-radius:10px;
    padding:9px 12px;min-width:150px;max-width:300px;outline:none;flex:none
  }
  .ptitle:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
  .ptitle::placeholder{color:#b9c1ce;font-weight:700}
  .spacer{flex:1;min-width:6px}
  .iconbtn{
    width:42px;height:42px;border:none;border-radius:12px;background:#f3f5f9;color:var(--ink);
    display:grid;place-items:center;cursor:pointer;transition:.15s; position:relative;flex:none;
  }
  .iconbtn:hover{background:#e9edf4}
  .iconbtn:active{transform:scale(.94)}
  .iconbtn.primary{background:var(--accent);color:#fff}
  .iconbtn.primary:hover{background:var(--accent-d)}
  .iconbtn svg{width:20px;height:20px}
  .durchk .chk{opacity:0;transition:.15s}
  .durchk.on{background:var(--accent);color:#fff}
  .durchk.on:hover{background:var(--accent-d)}
  .durchk.on .chk{opacity:1}
  .seg{display:flex;background:#f3f5f9;border-radius:12px;padding:4px;gap:2px;flex:none}
  .seg button{
    border:none;background:transparent;color:var(--muted);font-weight:700;font-size:13px;
    min-width:38px;height:34px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:2px
  }
  .seg button .u{font-size:10px;font-weight:600;opacity:.8}
  .seg button.active{background:#fff;color:var(--accent-d);box-shadow:var(--shadow-s)}

  .zoom{display:flex;align-items:center;gap:6px;background:#f3f5f9;border-radius:12px;padding:0 8px;height:42px;flex:none}
  .zoom button{border:none;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:4px}
  .zoom button:hover{color:var(--accent-d)}
  .zoom button svg{width:17px;height:17px}
  .zoom button .az{font-weight:900;line-height:1}
  .zoom button .az.sm{font-size:11px}
  .zoom button .az.lg{font-size:17px}
  .zoom input[type=range]{-webkit-appearance:none;appearance:none;width:88px;height:6px;border-radius:6px;background:#d8deea;outline:none}
  .zoom input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:var(--shadow-s)}
  .zoom input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}

  .tip{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);background:#2b3445;color:#fff;font-size:11px;
    padding:3px 7px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;font-weight:600;z-index:5}
  .iconbtn:hover .tip{opacity:.96}

  /* ---------- Layout ---------- */
  .workspace{position:fixed;top:60px;left:0;right:0;bottom:0;display:flex}
  .sidebar{
    width:134px;background:var(--panel);box-shadow:var(--shadow);z-index:20;
    display:flex;flex-direction:column;flex:none;
  }
  .sb-top{padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;flex:none;border-bottom:1px solid var(--line)}
  .sb-card{
    width:100%;height:46px;border-radius:13px;cursor:pointer;box-shadow:var(--shadow-s);
    touch-action:none;display:grid;place-items:center;color:rgba(0,0,0,.4);
  }
  .sb-card:active{transform:scale(.97)}
  .sb-card svg{width:22px;height:22px;opacity:.55}
  .sb-okiba{flex:1;min-height:60px;overflow-y:auto;overflow-x:hidden;padding:12px 11px 14px;display:flex;flex-direction:column;gap:8px}
  .sb-okiba.drophi{background:#eef6ff;box-shadow:inset 0 0 0 3px var(--accent)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .stagewrap{flex:1;position:relative;overflow:auto;padding:18px 20px 24px}
  .stage{margin:0 auto;width:max-content}
  .stagerow{display:flex;align-items:flex-start;gap:12px}
  .track{position:relative;display:flex;align-items:flex-start;gap:10px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:12px}

  .gutter{display:flex;flex-direction:column;flex:none;width:52px}
  .ghead{flex:none}
  .gbody{position:relative}
  .tick{position:absolute;right:6px;color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}

  .timeline{display:flex;flex-direction:column;flex:none;width:196px;transition:opacity .12s}
  .timeline.dragging{opacity:.55}
  .timeline.dragging .lane{outline:2px dashed var(--accent);outline-offset:-2px}
  .tl-head{display:flex;align-items:center;gap:3px;padding:0 2px 6px}
  .tl-grip{width:22px;height:30px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:grab;display:grid;place-items:center;flex:none;touch-action:none}
  .tl-grip:hover{background:#eef2f7;color:var(--accent-d)}
  .tl-grip:active{cursor:grabbing}
  .tl-grip svg{width:15px;height:15px}
  .tl-name{flex:1;min-width:0;border:none;background:#f3f5f9;border-radius:9px;padding:6px 8px;font-size:13px;font-weight:800;color:var(--ink);outline:none;text-align:center}
  .tl-name:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
  .tl-name::placeholder{color:#b9c1ce}
  .tl-del{width:26px;height:30px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}
  .tl-del:hover{background:#ffe3e3;color:#e03131}
  .tl-del svg{width:15px;height:15px}

  .lane{position:relative;border-radius:10px;background:#fbfcfe;touch-action:none}
  .lane.drophi{box-shadow:inset 0 0 0 3px var(--accent)}
  .lane-resize{position:absolute;top:0;bottom:0;right:-5px;width:10px;cursor:ew-resize;z-index:6;touch-action:none;
    display:flex;align-items:center;justify-content:center}
  .lane-resize::after{content:"";width:4px;height:34px;border-radius:4px;background:rgba(80,100,130,.18)}
  .lane-resize:hover::after{background:var(--accent)}
  /* 出力用に差し込む実要素の横線 */
  .gridcap{position:absolute;left:0;right:0;height:1px;background:var(--line);pointer-events:none}
  .gridcap.hour{background:var(--hour)}
  body.capturing .lane{background-image:none !important}

  .block{
    position:absolute;left:5px;right:5px;border-radius:11px;box-shadow:var(--shadow-s);cursor:grab;
    border:2px solid rgba(255,255,255,.55);touch-action:none;overflow:visible
  }
  .block:active{cursor:grabbing}
  .block.sel{box-shadow:0 0 0 3px var(--accent),var(--shadow);z-index:5}
  .block.dragghost{opacity:.55;cursor:grabbing;z-index:7;box-shadow:var(--shadow);transition:none}
  .block .inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:5px 8px;gap:2px;overflow:hidden;border-radius:9px}
  .block .btime{font-size:calc(10px*var(--fscale));font-weight:800;opacity:.72;letter-spacing:.2px}
  .block .blabel{font-size:calc(13px*var(--fscale));font-weight:800;line-height:1.2;outline:none;overflow:hidden;flex:1;word-break:break-word;cursor:text}
  .block .blabel:empty:before{content:"やること";opacity:.45;font-weight:700}
  .block .handle{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);height:6px;width:38px;background:rgba(0,0,0,.18);border-radius:6px;cursor:ns-resize}
  .block .handle.top{top:2px;bottom:auto}
  .block:hover .handle{background:rgba(0,0,0,.3)}
  /* short cards: single-row layout so text isn't clipped vertically */
  .block.short .inner{flex-direction:row;align-items:center;gap:5px;padding:2px 8px}
  .block.short .btime{font-size:calc(9px*var(--fscale));flex:none;white-space:nowrap}
  .block.short .blabel{font-size:calc(11px*var(--fscale));line-height:1.1;flex:1;white-space:nowrap;text-overflow:ellipsis}
  .block.tiny .inner{flex-direction:row;align-items:center;gap:0;padding:0 6px}
  .block.tiny .btime{display:none}
  .block.tiny .blabel{font-size:calc(9px*var(--fscale));line-height:1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .block.tiny .handle.top{display:none}

  .actionbar{position:absolute;left:100%;top:0;margin-left:7px;display:flex;gap:4px;background:#fff;padding:5px;border-radius:12px;box-shadow:var(--shadow);z-index:8}
  .actionbar button{width:32px;height:32px;border:none;border-radius:9px;background:#f3f5f9;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
  .actionbar button:hover{background:#e9edf4}
  .actionbar button.del:hover{background:#ffe3e3;color:#e03131}
  .actionbar button svg{width:17px;height:17px}
  .swatchpop{position:absolute;left:100%;top:46px;margin-left:7px;display:flex;flex-wrap:wrap;gap:6px;width:140px;background:#fff;padding:8px;border-radius:12px;box-shadow:var(--shadow);z-index:9}
  .swatchpop b{width:24px;height:24px;border-radius:7px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}

  /* external add-timeline tile (outside the white frame) */
  .addouter{display:flex;flex-direction:column;flex:none;width:64px}
  .addbtn{width:100%;border:2px dashed #cdd5e1;border-radius:14px;background:rgba(255,255,255,.55);color:#9aa4b4;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-weight:800;font-size:11px}
  .addbtn:hover{border-color:var(--accent);color:var(--accent-d);background:#f4f9ff}
  .addbtn svg{width:24px;height:24px}

  .ghostchip{position:fixed;z-index:60;min-width:72px;max-width:150px;height:34px;border-radius:11px;box-shadow:var(--shadow);
    pointer-events:none;opacity:.94;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;
    color:rgba(0,0,0,.45);font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden}

  /* ---------- okiba cards ---------- */
  .chip{position:relative;width:100%;min-width:0;min-height:40px;border-radius:11px;box-shadow:var(--shadow-s);
    display:flex;align-items:center;padding:7px 10px;cursor:grab;border:2px solid rgba(255,255,255,.5);touch-action:none}
  .chip:active{cursor:grabbing}
  .chip.sel{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
  .clabel{flex:1;min-width:0;font-size:calc(12px*var(--fscale));font-weight:800;line-height:1.2;outline:none;overflow:hidden;word-break:break-word;cursor:text}
  .clabel:empty:before{content:"カード";opacity:.5;font-weight:700}
  .chipbar{display:flex;gap:4px;justify-content:center;padding:1px 0 2px}
  .chipbar button{width:30px;height:30px;border:none;border-radius:9px;background:#f3f5f9;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
  .chipbar button:hover{background:#e9edf4}
  .chipbar button.del:hover{background:#ffe3e3;color:#e03131}
  .chipbar button svg{width:16px;height:16px}
  .chipswatch{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:0 4px 4px}
  .chipswatch b{width:21px;height:21px;border-radius:6px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  /* ---------- clear all ---------- */
  .clearall{position:fixed;right:18px;bottom:18px;z-index:45;display:flex;align-items:center;gap:7px;
    background:#fff;color:#e03131;border:none;border-radius:14px;padding:11px 15px;font-weight:800;font-size:13px;
    box-shadow:var(--shadow);cursor:pointer}
  .clearall:hover{background:#ffe3e3}
  .clearall:active{transform:scale(.96)}
  .clearall svg{width:18px;height:18px}

  /* ---------- menus ---------- */
  .menu{position:fixed;top:64px;background:#fff;border-radius:14px;box-shadow:var(--shadow);z-index:50;padding:8px;min-width:236px;display:none}
  .menu.open{display:block;animation:pop .12s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .menu .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}
  .menu .row:hover{background:#f3f5f9}
  .menu .row svg{width:19px;height:19px;color:var(--accent-d);flex:none}
  .menu .sep{height:1px;background:var(--line);margin:6px 6px}
  .menu .ttl{font-size:11px;color:var(--muted);font-weight:800;padding:6px 12px 2px;letter-spacing:.4px}
  .bgmenu{min-width:0}
  .bgswatches{display:flex;flex-wrap:wrap;gap:8px;width:188px;padding:6px 6px 4px}
  .bgswatches b{width:32px;height:32px;border-radius:9px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .1s}
  .bgswatches b:hover{transform:scale(1.08)}
  .bgswatches b.on{box-shadow:0 0 0 2px var(--accent),inset 0 0 0 1px rgba(0,0,0,.12)}
  .pagesel{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:4px 12px 8px}
  .pagesel>span{font-size:12px;font-weight:800;color:var(--muted);padding-top:6px}
  .pagesel-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .pageseg{display:flex;gap:3px;background:#eef1f6;border-radius:9px;padding:3px}
  .pageseg button{border:none;background:transparent;width:30px;height:26px;border-radius:7px;font-weight:800;font-size:13px;color:var(--ink);cursor:pointer}
  .pageseg button.active{background:var(--accent);color:#fff}
  .reviewbtn{display:flex;align-items:center;gap:5px;border:none;background:#eef4ff;color:var(--accent-d);border-radius:9px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer}
  .reviewbtn:hover{background:var(--accent);color:#fff}
  .reviewbtn svg{width:15px;height:15px}
  /* output preview overlay */
  .reviewov{position:fixed;inset:0;background:rgba(20,28,40,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .reviewbox{background:#fff;border-radius:16px;width:min(900px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
  .reviewhd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
  .reviewhd b{font-size:15px;color:var(--ink)}
  .reviewclose{border:none;background:#f3f5f9;width:32px;height:32px;border-radius:9px;cursor:pointer;font-weight:800;color:var(--ink)}
  .reviewclose:hover{background:#e9edf4}
  .reviewbody{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px;background:#eef1f6}
  .reviewpage{background:#fff;box-shadow:var(--shadow-s);border-radius:6px;padding:10px}
  .reviewpagelab{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
  .reviewpage img{width:100%;height:auto;display:block;border-radius:4px}
  .reviewempty{padding:30px;text-align:center;color:var(--muted);font-weight:700}
  .settings .field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 12px}
  .settings label{font-weight:700;font-size:13px;color:var(--muted)}
  .settings input[type=time]{border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:14px;font-weight:700;color:var(--ink)}

  .histlist{max-height:268px;overflow:auto}
  .histrow{display:flex;align-items:center;border-radius:10px}
  .histrow:hover{background:#f3f5f9}
  .histmain{flex:1;padding:8px 12px;cursor:pointer;min-width:0}
  .histmain .ht{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .histmain .hd{font-size:11px;color:var(--muted);font-weight:700;margin-top:1px}
  .histdel{width:30px;height:30px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-weight:900;font-size:13px;margin-right:4px;flex:none}
  .histdel:hover{background:#ffe3e3;color:#e03131}
  .histempty{padding:14px;color:var(--muted);font-weight:700;font-size:13px;text-align:center}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:#2b3445;color:#fff;
    padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .overlapask{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b3445;color:#fff;
    padding:10px 12px 10px 16px;border-radius:14px;box-shadow:var(--shadow);z-index:90;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;max-width:92vw}
  .overlapask button{border:none;border-radius:10px;padding:8px 16px;font-weight:800;font-size:14px;cursor:pointer;flex:none}
  .overlapask .oa-yes{background:var(--accent);color:#fff}
  .overlapask .oa-yes:hover{background:var(--accent-d)}
  .overlapask .oa-no{background:#5b6675;color:#fff}
  .overlapask .oa-no:hover{background:#6b7686}

  /* hide chrome for capture / print */
  body.capturing .no-capture{display:none !important}

  /* 閲覧専用（共有URLで開いたとき）: タイムラインだけ表示・編集UIは隠す */
  .vbadge{display:none}
  body.viewonly .no-capture{display:none !important}
  body.viewonly #btnClock,
  body.viewonly #segScale,
  body.viewonly #btnDur,
  body.viewonly #btnBg,
  body.viewonly #btnOut,
  body.viewonly #btnSave{display:none !important}
  body.viewonly .ptitle{pointer-events:none;background:transparent;border-color:transparent}
  body.viewonly .block{cursor:default}
  body.viewonly .vbadge{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:3px 11px;border-radius:999px;background:#eef3f9;color:#5b6675;font-size:12px;font-weight:700;white-space:nowrap}
  /* タッチ端末で閲覧専用ページのタイムラインを指でスクロールできるように
     （編集UIは無効化済みなので touch-action を戻す） */
  body.viewonly .block,
  body.viewonly .lane,
  body.viewonly .lane-resize,
  body.viewonly .tl-grip,
  body.viewonly .sb-card,
  body.viewonly .chip{touch-action:auto}
  body.viewonly .stagewrap{-webkit-overflow-scrolling:touch}

  /* ---------- スマホ・タブレット（端末を選ばず閲覧できるように） ---------- */
  @media (max-width:1120px){
    .topbar{height:54px;gap:6px;padding:0 9px}
    .ptitle{font-size:14px;min-width:96px;max-width:170px;padding:8px 10px}
    .zoom{height:38px;padding:0 6px;gap:4px}
    .zoom input[type=range]{width:74px}
    .iconbtn{width:38px;height:38px}
    .iconbtn svg{width:18px;height:18px}
    .seg button{min-width:32px;height:30px}
    .sidebar{width:112px}
    .stagewrap{padding:12px 12px 18px}
  }
  @media (max-width:460px){
    .ptitle{min-width:74px;max-width:130px}
    .zoom input[type=range]{width:58px}
    .vbadge{margin-left:4px}
  }
  @media print{
    .topbar,.sidebar,.menu,.toast,.ghostchip,.actionbar,.swatchpop,.chipbar,.chipswatch,.clearall,.addouter,.no-capture{display:none !important}
    body{overflow:visible;background:#fff}
    .workspace{position:static}
    .main{display:block}
    .stagewrap{overflow:visible;padding:0}
    .track{box-shadow:none}
    .block.sel{box-shadow:var(--shadow-s) !important}
  }
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<div class="topbar">
  <input class="ptitle" id="ptitle" placeholder="タイトル" maxlength="60" />
  <span class="vbadge" id="vbadge"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>閲覧専用</span>

  <div class="spacer"></div>

  <!-- time range (clock) -->
  <button class="iconbtn" id="btnClock" aria-label="時間の範囲">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5"/><path d="M5 3 2.5 5.5"/><path d="M19 3l2.5 2.5"/></svg>
    <span class="tip">時間の範囲</span>
  </button>

  <!-- time scale -->
  <div class="seg" id="segScale">
    <button data-s="1"><span>1</span><span class="u">分</span></button>
    <button data-s="5"><span>5</span><span class="u">分</span></button>
    <button data-s="10"><span>10</span><span class="u">分</span></button>
    <button data-s="30"><span>30</span><span class="u">分</span></button>
    <button data-s="60"><span>60</span><span class="u">分</span></button>
  </div>

  <!-- duration toggle -->
  <button class="iconbtn durchk" id="btnDur" aria-label="所要時間を表示">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path class="chk" d="M7.5 12.5l3 3 6-6.5"/></svg>
    <span class="tip">所要時間</span>
  </button>

  <!-- zoom -->
  <div class="zoom">
    <button id="zOut" aria-label="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <input type="range" id="zoom" min="0.8" max="8" step="0.2" value="2" />
    <button id="zIn" aria-label="拡大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6"/><path d="M21 21l-4.3-4.3"/></svg></button>
  </div>

  <!-- font size -->
  <div class="zoom">
    <button id="fOut" aria-label="文字を小さく"><span class="az sm">A</span></button>
    <input type="range" id="fsize" min="0.7" max="2" step="0.1" value="1" aria-label="文字の大きさ" />
    <button id="fIn" aria-label="文字を大きく"><span class="az lg">A</span></button>
  </div>

  <!-- background color -->
  <button class="iconbtn" id="btnBg" aria-label="背景色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3 4 10a1.6 1.6 0 0 0 0 2.3l5.7 5.7a1.6 1.6 0 0 0 2.3 0l5.4-5.4a1 1 0 0 0 0-1.4L11 3z"/><path d="M9 5.2 7 3.2"/><path d="M4.5 12.5h13"/><path d="M20 15s1.6 1.9 1.6 3a1.6 1.6 0 1 1-3.2 0c0-1.1 1.6-3 1.6-3z"/></svg>
    <span class="tip">背景色</span>
  </button>

  <!-- output -->
  <button class="iconbtn" id="btnOut" aria-label="出力">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/></svg>
    <span class="tip">出力</span>
  </button>

  <!-- save / history -->
  <button class="iconbtn" id="btnSave" aria-label="保存・履歴">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
    <span class="tip">保存・履歴</span>
  </button>
</div>

<!-- ============ WORKSPACE ============ -->
<div class="workspace">
  <div class="sidebar no-capture" id="sidebar">
    <div class="sb-top">
      <div class="sb-card" id="sbCard" title="クリックまたはドラッグでカードを追加"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
    </div>
    <div class="sb-okiba" id="okibaBody"></div>
  </div>

  <div class="main">
    <div class="stagewrap" id="stagewrap">
      <div class="stage" id="stage">
        <div class="stagerow">
          <div class="track" id="track"></div>
          <div class="addouter no-capture" id="addOuter"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<button class="clearall no-capture" id="clearAll" aria-label="一括削除">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
  一括削除
</button>

<!-- ============ OUTPUT MENU ============ -->
<div class="menu" id="outMenu">
  <div class="ttl">しゅつりょく</div>
  <div class="pagesel">
    <span>出力の枚数(PDF/画像)</span>
    <div class="pagesel-right">
      <div class="pageseg" id="pageSeg">
        <button data-p="1" class="active">1</button>
        <button data-p="2">2</button>
        <button data-p="3">3</button>
      </div>
      <button class="reviewbtn" id="btnReview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>プレビュー</button>
    </div>
  </div>
  <div class="row" data-act="print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>印刷</div>
  <div class="row" data-act="pdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg>PDF</div>
  <div class="row" data-act="jpeg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>JPEG</div>
  <div class="row" data-act="png"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 13l-4-4-7 7"/><path d="M3 18l4-4 3 3"/></svg>PNG</div>
  <div class="row" data-act="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>テキスト</div>
  <div class="sep"></div>
  <div class="ttl">データ</div>
  <div class="row" data-act="jsonSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>JSON</div>
  <div class="row" data-act="excel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Excel</div>
  <div class="row" data-act="gsheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>Googleスプレッドシート</div>
  <div class="sep"></div>
  <div class="row" data-act="url"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>URL</div>
</div>

<!-- ============ SAVE / HISTORY MENU ============ -->
<div class="menu" id="saveMenu">
  <div class="row" data-sact="snap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>保存</div>
  <div class="row" data-sact="jsonLoad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>JSON読み込み</div>
  <div class="sep"></div>
  <div class="ttl">履歴</div>
  <div class="histlist" id="histList"></div>
</div>

<!-- ============ BACKGROUND COLOR ============ -->
<div class="menu bgmenu" id="bgMenu">
  <div class="ttl">はいけいの いろ</div>
  <div class="bgswatches" id="bgSwatches"></div>
</div>

<!-- ============ SETTINGS ============ -->
<div class="menu settings" id="setMenu">
  <div class="field"><label>開始</label><input type="time" id="setStart" step="300" /></div>
  <div class="field"><label>終了</label><input type="time" id="setEnd" step="300" /></div>
</div>

<input type="file" id="fileIn" accept="application/json,.json" style="display:none" />
<div class="toast" id="toast"></div>

    if(typeof s.bg!=="string"||!/^#[0-9a-fA-F]{6}$/.test(s.bg))s.bg="#FFFFFF";
    if([1,5,10,30,60].indexOf(s.scale)<0)s.scale=30;
    return s;
  }
  function saveLocal(){if(viewMode)return;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function persist(){
    const snap=JSON.stringify(state);
    if(lastCommitted!==null && snap!==lastCommitted){
      undoStack.push(lastCommitted);
      if(undoStack.length>100)undoStack.shift();
      redoStack.length=0;
    }
    lastCommitted=snap;
    saveLocal();
  }
  function undo(){
    if(!undoStack.length){toast("これ以上戻せません");return;}
    redoStack.push(lastCommitted);
    const prev=undoStack.pop();
    lastCommitted=prev;
    state=normalize(JSON.parse(prev));
    selId=null;
    saveLocal();render();toast("元に戻しました");
  }
  function redo(){
    if(!redoStack.length){toast("これ以上やり直せません");return;}
    undoStack.push(lastCommitted);
    const next=redoStack.pop();
    lastCommitted=next;
    state=normalize(JSON.parse(next));
    selId=null;
    saveLocal();render();toast("やり直しました");
  }
  function load(){try{const r=localStorage.getItem(KEY);if(r)state=normalize(JSON.parse(r));}catch(e){}}

  // ---- 共有URL用：コンパクト表現（キー名やidを省きURLを短く） ----
  function colIdx(c){const i=COLORS.indexOf((c||"").toUpperCase());return i<0?COLORS.length-1:i;}
  function colOf(i){return COLORS[(typeof i==="number"&&i>=0&&i<COLORS.length)?i:COLORS.length-1];}
  function toCompact(s){
    return [1, s.title||"", s.scale, s.startMin, s.endMin, s.ppm, s.fontScale, s.showDur?1:0, colIdx(s.bg),
      (s.timelines||[]).map(t=>[t.name||"", t.width||0, (t.blocks||[]).map(b=>[b.startMin,b.durMin,b.label||"",colIdx(b.color)])]),
      (s.parking||[]).map(p=>[p.label||"",colIdx(p.color),p.durMin])];
  }
  function fromCompact(a){
    return {
      title:a[1]||"", scale:a[2], startMin:a[3], endMin:a[4], ppm:a[5], fontScale:a[6], showDur:!!a[7], bg:colOf(a[8]),
      timelines:(a[9]||[]).map((t,ti)=>({id:"t"+(ti+1), name:t[0]||"", width:t[1]||undefined,
        blocks:(t[2]||[]).map(b=>({id:gid("b"), startMin:b[0], durMin:b[1], label:b[2]||"", color:colOf(b[3])}))})),
      parking:(a[10]||[]).map(p=>({id:gid("p"), label:p[0]||"", color:colOf(p[1]), durMin:p[2]}))
    };
  }
  // 共有URL文字列を生成（短く・端末を選ばず開けるように圧縮）
  function shareData(){return LZString.compressToEncodedURIComponent(JSON.stringify(toCompact(state)));}

  function fromHash(){
    const h=location.hash||"";
    // 新形式（圧縮）: #z=
    if(h.indexOf("#z=")===0){
      try{
        let b=h.slice(3);
        try{b=decodeURIComponent(b);}catch(e){}            // 一部アプリが%エンコードした場合に戻す
        const j=LZString.decompressFromEncodedURIComponent(b);
        if(j){
          state=normalize(fromCompact(JSON.parse(j)));
          viewMode=true;
          return true;
        }
      }catch(e){}
    }
    // 旧形式（base64 JSON）: #d=  （以前に共有されたURLも開けるように残す）
    if(h.indexOf("#d=")===0){
      try{
        let b=h.slice(3);
        try{b=decodeURIComponent(b);}catch(e){}            // 一部アプリが%エンコードした場合に戻す
        b=b.replace(/ /g,"+").replace(/-/g,"+").replace(/_/g,"/"); // base64url・空白化を許容
        while(b.length%4)b+="=";
        const j=decodeURIComponent(escape(atob(b)));
        state=normalize(JSON.parse(j));
        viewMode=true;                                     // 共有URLは閲覧専用で表示（編集不可・タイムラインのみ）
        return true;                                       // localStorageは上書きしない（受け取った人の作業を守る／URLのhashで再読込も保持）
      }catch(e){}
    }
    return false;
  }

  // ---------------- drop highlight ----------------
  function setDropHi(el){if(dropHiEl===el)return;if(dropHiEl)dropHiEl.classList.remove("drophi");dropHiEl=el;if(el)el.classList.add("drophi");}
  function clearDropHi(){if(dropHiEl){dropHiEl.classList.remove("drophi");dropHiEl=null;}}

  // ---------------- render ----------------
  function render(){
    const L=laneLen();
    track.innerHTML="";
    track.style.background=state.bg||"#FFFFFF";   // 背景色
    // gutter
    const g=document.createElement("div"); g.className="gutter";
    const gh=document.createElement("div"); gh.className="ghead"; gh.style.height=HEAD+"px";
    const gb=document.createElement("div"); gb.className="gbody"; gb.style.height=L+"px";
    const ticks=[state.startMin];                 // 始まりの時刻は必ず表示
    const minGap=13/state.ppm;                     // ラベルが重ならない最小間隔(分)
    const sH=Math.ceil(state.startMin/60), eH=Math.floor(state.endMin/60);
    for(let h=sH;h<=eH;h++){const m=h*60; if(m>state.startMin+minGap && m<state.endMin-minGap)ticks.push(m);}
    ticks.push(state.endMin);                       // 終わりの時刻は必ず表示
    ticks.forEach(mm=>{const t=document.createElement("div");t.className="tick";t.textContent=fmt(mm);t.style.top=(posPx(mm)-7)+"px";gb.appendChild(t);});
    g.appendChild(gh); g.appendChild(gb); track.appendChild(g);

    // timelines
    state.timelines.forEach(tl=>{
      const col=document.createElement("div"); col.className="timeline"+(tl.id===reorderId?" dragging":"");
      col.style.width=laneW(tl)+"px";
      const head=document.createElement("div"); head.className="tl-head"; head.style.height=HEAD+"px";
      const grip=document.createElement("button"); grip.className="tl-grip no-capture"; grip.title="ドラッグで並べ替え";
      grip.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="18" r="1"/></svg>';
      grip.addEventListener("pointerdown",e=>onGripDown(e,tl));
      head.appendChild(grip);
      const nm=document.createElement("input"); nm.className="tl-name"; nm.placeholder="名称"; nm.value=tl.name||""; nm.maxLength=20; if(viewMode)nm.readOnly=true;
      nm.addEventListener("input",()=>{tl.name=nm.value;saveLocal();});
      nm.addEventListener("change",()=>{tl.name=nm.value;persist();});
      nm.addEventListener("pointerdown",e=>e.stopPropagation());
      head.appendChild(nm);
      if(state.timelines.length>1){
        const del=document.createElement("button"); del.className="tl-del no-capture"; del.title="このタイムラインを削除";
        del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
        del.onclick=()=>deleteTimeline(tl.id);
        head.appendChild(del);
      }
      const lane=document.createElement("div"); lane.className="lane"; lane.dataset.tl=tl.id;
      lane.style.height=L+"px"; lane.style.width=laneW(tl)+"px";
      let gStepMin=state.scale, gStepPx=gStepMin*state.ppm;
      while(gStepPx<6){gStepMin+=state.scale;gStepPx=gStepMin*state.ppm;}
      lane.style.backgroundImage=
        "repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px "+gStepPx+"px),"+
        "repeating-linear-gradient(to bottom,var(--hour) 0 1px,transparent 1px "+(60*state.ppm)+"px)";
      lane.addEventListener("pointerdown",e=>{if(e.target===lane){selId=null;render();}});
      tl.blocks.forEach(b=>lane.appendChild(buildBlock(b)));
      const rz=document.createElement("div"); rz.className="lane-resize no-capture"; rz.title="ドラッグで横幅を調整";
      rz.addEventListener("pointerdown",e=>onLaneResizeDown(e,tl,col,lane));
      lane.appendChild(rz);
      col.appendChild(head); col.appendChild(lane); track.appendChild(col);
    });

    // external add-timeline tile (outside the white frame)
    addOuter.innerHTML="";
    if(state.timelines.length<MAXTL){
      const sp=document.createElement("div"); sp.style.height=(HEAD+PAD)+"px"; sp.style.flex="none";
      const btn=document.createElement("div"); btn.className="addbtn"; btn.style.height=L+"px";
      btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>追加';
      btn.onclick=addTimeline;
      addOuter.appendChild(sp); addOuter.appendChild(btn);
    }

    // okiba
    okibaBody.innerHTML="";
    state.parking.forEach(c=>{okibaBody.appendChild(buildChip(c));if(c.id===selId)okibaBody.appendChild(buildChipBar(c));});

    ptitle.value=state.title;
    $("#zoom").value=state.ppm;
    $("#fsize").value=state.fontScale;
    document.documentElement.style.setProperty("--fscale",state.fontScale);
    $("#btnDur").classList.toggle("on",!!state.showDur);
    [...document.querySelectorAll("#segScale button")].forEach(x=>x.classList.toggle("active",+x.dataset.s===state.scale));
  }

  function styleBlock(el,b){
    el.style.top=posPx(b.startMin)+"px";
    const h=b.durMin*state.ppm;
    el.style.height=h+"px";
    el.style.background=b.color; el.style.color=inkOn(b.color);
    el.classList.toggle("short", h<48 && h>=26);
    el.classList.toggle("tiny", h<26);
    const tm=el.querySelector(".btime"); if(tm)tm.textContent=fmt(b.startMin)+"–"+fmt(b.startMin+b.durMin)+(state.showDur?"（"+b.durMin+"分）":"");
  }
  function buildBlock(b){
    const el=document.createElement("div"); el.className="block"+(b.id===selId?" sel":""); el.dataset.id=b.id;
    const inner=document.createElement("div"); inner.className="inner";
    const tm=document.createElement("div"); tm.className="btime";
    const lb=document.createElement("div"); lb.className="blabel"; lb.textContent=b.label||"";
    inner.appendChild(tm); inner.appendChild(lb); el.appendChild(inner);
    styleBlock(el,b);
    if(viewMode) return el;                       // 閲覧専用: 操作ハンドル・編集ハンドラは付けない
    const ht=document.createElement("div"); ht.className="handle top no-capture"; el.appendChild(ht);
    const h=document.createElement("div"); h.className="handle no-capture"; el.appendChild(h);
    if(b.id===selId) el.appendChild(buildActionBar(b));
    el.addEventListener("pointerdown",e=>onBlockDown(e,b));
    ht.addEventListener("pointerdown",e=>onHandleTopDown(e,b));
    h.addEventListener("pointerdown",e=>onHandleDown(e,b));
    lb.addEventListener("dblclick",e=>{e.stopPropagation();startEditEl(lb,v=>{b.label=v;});});
    return el;
  }
  function buildActionBar(b){
    const bar=document.createElement("div"); bar.className="actionbar no-capture";
    bar.addEventListener("pointerdown",e=>e.stopPropagation());
    const mk=(svg,cls,fn)=>{const x=document.createElement("button");x.className=cls||"";x.innerHTML=svg;x.onclick=ev=>{ev.stopPropagation();fn();};return x;};
    bar.appendChild(mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',"",()=>{const el=blockEl(b.id);const lb=el&&el.querySelector(".blabel");if(lb)startEditEl(lb,v=>{b.label=v;});}));
    bar.appendChild(mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="7" cy="10" r="1.6"/><circle cx="9.5" cy="16" r="1.6"/><path d="M12 2a10 10 0 1 0 0 20 2 2 0 0 0 2-2 2 2 0 0 1 2-2h1a4 4 0 0 0 4-4 10 10 0 0 0-9-10z"/></svg>',"",()=>toggleSwatch(b)));
    bar.appendChild(mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',"",()=>duplicate(b.id)));
    bar.appendChild(mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',"del",()=>removeCard(b.id)));
    return bar;
  }
  function toggleSwatch(b){
    const ex=track.querySelector(".swatchpop"); if(ex){ex.remove();return;}
    const el=blockEl(b.id); if(!el)return;
    const pop=document.createElement("div"); pop.className="swatchpop no-capture";
    pop.addEventListener("pointerdown",e=>e.stopPropagation());
    COLORS.forEach(c=>{const s=document.createElement("b");s.style.background=c;s.onclick=ev=>{ev.stopPropagation();b.color=c;persist();render();};pop.appendChild(s);});
    el.appendChild(pop);
  }

  function buildChip(c){
    const el=document.createElement("div"); el.className="chip"+(c.id===selId?" sel":""); el.dataset.id=c.id;
    el.style.background=c.color; el.style.color=inkOn(c.color);
    const lb=document.createElement("div"); lb.className="clabel"; lb.textContent=c.label||"";
    el.appendChild(lb);
    el.addEventListener("pointerdown",e=>onChipDown(e,c));
    lb.addEventListener("dblclick",e=>{e.stopPropagation();startEditEl(lb,v=>{c.label=v;});});
    return el;
  }
  function buildChipBar(c){
    const bar=document.createElement("div"); bar.className="chipbar no-capture";
    bar.addEventListener("pointerdown",e=>e.stopPropagation());
    const mk=(svg,cls,fn)=>{const x=document.createElement("button");x.className=cls||"";x.innerHTML=svg;x.onclick=ev=>{ev.stopPropagation();fn();};return x;};
    bar.appendChild(mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',"",()=>{const lb=chipEl(c.id)&&chipEl(c.id).querySelector(".clabel");if(lb)startEditEl(lb,v=>{c.label=v;});}));
    bar.appendChild(mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="7" cy="10" r="1.6"/><circle cx="9.5" cy="16" r="1.6"/><path d="M12 2a10 10 0 1 0 0 20 2 2 0 0 0 2-2 2 2 0 0 1 2-2h1a4 4 0 0 0 4-4 10 10 0 0 0-9-10z"/></svg>',"",()=>toggleChipSwatch(c)));
    bar.appendChild(mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',"",()=>duplicate(c.id)));
    bar.appendChild(mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',"del",()=>removeCard(c.id)));
    return bar;
  }
  function toggleChipSwatch(c){
    const ex=okibaBody.querySelector(".chipswatch"); if(ex){ex.remove();return;}
    const bar=okibaBody.querySelector(".chipbar"); if(!bar)return;
    const pop=document.createElement("div"); pop.className="chipswatch no-capture";
    pop.addEventListener("pointerdown",e=>e.stopPropagation());
    COLORS.forEach(col=>{const s=document.createElement("b");s.style.background=col;s.onclick=ev=>{ev.stopPropagation();c.color=col;persist();render();};pop.appendChild(s);});
    bar.after(pop);
  }

  // ---------------- editing ----------------
  function startEditEl(lb,onDone){
    if(lb.isContentEditable)return;
    lb.contentEditable="true"; lb.focus();
    const r=document.createRange(); r.selectNodeContents(lb);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    const done=()=>{lb.contentEditable="false";onDone(lb.textContent.trim());persist();render();};
    lb.addEventListener("blur",done,{once:true});
    lb.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();lb.blur();}if(e.key==="Escape"){e.preventDefault();lb.blur();}});
  }

  // ---------------- card ops ----------------
  function addBlock(tlId,startMin,color){
    const tl=state.timelines.find(t=>t.id===tlId); if(!tl)return;
    const def=Math.max(state.scale,Math.ceil(30/state.scale)*state.scale);
    const s=clamp(snap(startMin),state.startMin,state.endMin-state.scale);
    const d=Math.min(def,state.endMin-s);
    const b={id:gid("b"),startMin:s,durMin:d,label:"",color:color||"#4DABF7"};
    tl.blocks.push(b); selId=b.id; persist(); render();
    const lb=blockEl(b.id)&&blockEl(b.id).querySelector(".blabel"); if(lb)startEditEl(lb,v=>{b.label=v;}); // 作成直後はすぐ名前を入力できるように
  }
  function addParkedCard(color){
    const c={id:gid("p"),label:"",color:color||"#4DABF7",durMin:Math.max(state.scale,30)};
    state.parking.push(c); selId=c.id; persist(); render();
    const lb=chipEl(c.id)&&chipEl(c.id).querySelector(".clabel"); if(lb)startEditEl(lb,v=>{c.label=v;}); // 作成直後はすぐ名前を入力できるように
  }
  function duplicate(id){
    const f=findCard(id); if(!f)return;
    if(f.kind==="tl"){
      const nb=Object.assign({},f.b,{id:gid("b")});
      nb.startMin=clamp(nb.startMin+nb.durMin,state.startMin,state.endMin-nb.durMin);
      f.tl.blocks.push(nb); selId=nb.id;
    }else{
      const nc={id:gid("p"),label:f.b.label,color:f.b.color,durMin:f.b.durMin};
      state.parking.push(nc); selId=nc.id;
    }
    persist(); render();
  }
  function removeCard(id){
    const f=findCard(id); if(!f)return;
    if(f.kind==="tl")f.tl.blocks.splice(f.i,1); else state.parking.splice(f.i,1);
    if(selId===id)selId=null; persist(); render();
  }
  function reassign(id,tlId){
    const f=findCard(id); const tgt=state.timelines.find(t=>t.id===tlId);
    if(!f||f.kind!=="tl"||!tgt||tgt===f.tl)return;
    f.tl.blocks.splice(f.i,1); tgt.blocks.push(f.b);
  }
  function parkBlock(id){
    const f=findCard(id); if(!f||f.kind!=="tl")return;
    f.tl.blocks.splice(f.i,1);
    state.parking.push({id:f.b.id,label:f.b.label,color:f.b.color,durMin:f.b.durMin});
    persist(); render();
  }
  function unparkTo(id,tlId,startMin){
    const f=findCard(id); if(!f||f.kind!=="park")return;
    const tl=state.timelines.find(t=>t.id===tlId); if(!tl)return;
    state.parking.splice(f.i,1);
    const s=clamp(snap(startMin),state.startMin,state.endMin-state.scale);
    const d=Math.min(f.b.durMin||state.scale,state.endMin-s);
    tl.blocks.push({id:f.b.id,startMin:s,durMin:d,label:f.b.label,color:f.b.color});
    selId=f.b.id; persist(); render();
  }
  function pasteClip(){
    if(!clip)return;
    let tl=clip.tlId&&state.timelines.find(t=>t.id===clip.tlId);
    if(!tl)tl=state.timelines[0]; if(!tl)return;
    const dur=clip.durMin||state.scale;
    let s=clip.startMin!=null?clip.startMin+dur:state.startMin;
    s=clamp(snap(s),state.startMin,state.endMin-dur);
    const b={id:gid("b"),startMin:s,durMin:Math.min(dur,state.endMin-s),label:clip.label||"",color:clip.color||"#4DABF7"};
    tl.blocks.push(b); selId=b.id; persist(); render(); toast("貼り付けました");
  }
  function select(id){if(selId===id)return;selId=id;render();}

  function addTimeline(){
    if(state.timelines.length>=MAXTL){toast("タイムラインは最大"+MAXTL+"個までです");return;}
    state.timelines.push({id:gid("t"),name:"",blocks:[]}); persist(); render();
  }
  function deleteTimeline(id){
    if(state.timelines.length<=1){toast("タイムラインは1つ必要です");return;}
    const tl=state.timelines.find(t=>t.id===id); if(!tl)return;
    if(tl.blocks.length && !confirm("このタイムラインとカードを削除しますか？"))return;
    state.timelines=state.timelines.filter(t=>t.id!==id);
    if(selId&&!findCard(selId))selId=null;
    persist(); render();
  }
  function reorderTo(dragId,clientX){
    const cols=[...track.querySelectorAll(".timeline")];
    const order=state.timelines.map(t=>t.id);
    let pos=cols.length;
    for(let i=0;i<cols.length;i++){const r=cols[i].getBoundingClientRect();if(clientX<r.left+r.width/2){pos=i;break;}}
    const from=order.indexOf(dragId); if(from<0)return false;
    order.splice(from,1);
    const insert=pos>from?pos-1:pos;
    order.splice(insert,0,dragId);
    const changed=order.some((id,i)=>id!==state.timelines[i].id);
    if(!changed)return false;
    state.timelines.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
    return true;
  }

  // ---------------- geometry ----------------
  function laneAtPoint(x,y){
    for(const lane of track.querySelectorAll(".lane")){
      const r=lane.getBoundingClientRect();
      if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return{tlId:lane.dataset.tl,rect:r,el:lane};
    }
    return null;
  }

  // ---------------- auto-shift: resolve overlaps around an edited block ----------------
  function resolveOverlaps(tl,anchorId){
    const a=tl.blocks.find(b=>b.id===anchorId); if(!a)return;
    const lo=state.startMin, hi=state.endMin;
    const below=tl.blocks.filter(b=>b.id!==anchorId&&b.startMin>=a.startMin).sort((x,y)=>x.startMin-y.startMin);
    const above=tl.blocks.filter(b=>b.id!==anchorId&&b.startMin<a.startMin).sort((x,y)=>y.startMin-x.startMin);
    let floor=a.startMin+a.durMin;
    below.forEach(b=>{ if(b.startMin<floor)b.startMin=floor; floor=b.startMin+b.durMin; });
    let ceil=a.startMin;
    above.forEach(b=>{ if(b.startMin+b.durMin>ceil)b.startMin=ceil-b.durMin; ceil=b.startMin; });
    tl.blocks.forEach(b=>{ b.startMin=clamp(b.startMin,lo,hi-b.durMin); });
  }
  function restyleLane(tl){ tl.blocks.forEach(b=>{const el=blockEl(b.id); if(el)styleBlock(el,b);}); }
  function hasOverlap(tl,anchorId){
    const a=tl.blocks.find(b=>b.id===anchorId); if(!a)return false;
    const ae=a.startMin+a.durMin;
    return tl.blocks.some(b=>b.id!==anchorId && b.startMin<ae && (b.startMin+b.durMin)>a.startMin);
  }

  // html2canvas は repeating-linear-gradient をうまく描けないので、出力時は実要素の横線を差し込む
  function addCaptureGrid(){
    const lanes=[...track.querySelectorAll(".lane")];
    const total=state.endMin-state.startMin;
    let gStepMin=state.scale, gStepPx=gStepMin*state.ppm;
    while(gStepPx<6){gStepMin+=state.scale;gStepPx=gStepMin*state.ppm;}
    const firstHour=Math.ceil(state.startMin/60)*60;
    lanes.forEach(lane=>{
      const frag=document.createDocumentFragment();
      for(let mm=0;mm<=total+0.001;mm+=gStepMin){
        const ln=document.createElement("div"); ln.className="gridcap"; ln.style.top=(mm*state.ppm)+"px"; frag.appendChild(ln);
      }
      for(let h=firstHour;h<=state.endMin;h+=60){
        const ln=document.createElement("div"); ln.className="gridcap hour"; ln.style.top=((h-state.startMin)*state.ppm)+"px"; frag.appendChild(ln);
      }
      lane.insertBefore(frag,lane.firstChild);
    });
  }

  function sliceCanvas(canvas,n){
    const N=clamp(n,1,3); const parts=[]; const sliceH=Math.ceil(canvas.height/N);
    for(let i=0;i<N;i++){
      const sy=i*sliceH, sh=Math.min(sliceH,canvas.height-sy);
      if(sh<=0)break;
      const part=document.createElement("canvas"); part.width=canvas.width; part.height=sh;
      part.getContext("2d").drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
      parts.push(part);
    }
    return parts;
  }

      const parts=sliceCanvas(canvas,outPages);
      parts.forEach((p,i)=>{const nm=safeName()+(parts.length>1?"_"+(i+1):"")+".jpg";
        setTimeout(()=>p.toBlob(b=>download(b,nm),"image/jpeg",0.95),i*350);});
    },
    async png(){
      toast(outPages>1?outPages+"枚の画像を書き出し中…":"画像を書き出し中…");
      const canvas=await captureCanvas();
      const parts=sliceCanvas(canvas,outPages);
      parts.forEach((p,i)=>{const nm=safeName()+(parts.length>1?"_"+(i+1):"")+".png";
        setTimeout(()=>p.toBlob(b=>download(b,nm),"image/png"),i*350);});
    },
    text(){
      const txt=buildText();
      download(new Blob([txt],{type:"text/plain;charset=utf-8"}),safeName()+".txt");
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(()=>toast("テキストを保存＆コピーしました"),()=>toast("テキストを保存しました"));
      else toast("テキストを保存しました");
    },
    jsonSave(){download(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),safeName()+".json");toast("JSONを保存しました");},
    jsonLoad(){$("#fileIn").click();},
    excel(){
      if(!window.XLSX){toast("Excelライブラリ未読込");return;}
      const ws=XLSX.utils.json_to_sheet(rows(),{header:HEAD_ROW});
      ws["!cols"]=[{wch:14},{wch:8},{wch:8},{wch:9},{wch:40}];
      const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"プログラム");
      XLSX.writeFile(wb,safeName()+".xlsx"); toast("Excelを出力しました");
    },
    gsheet(){
      const tsv=[HEAD_ROW.join("\t")].concat(rows().map(r=>HEAD_ROW.map(h=>r[h]).join("\t"))).join("\n");
      const open=()=>window.open("https://docs.google.com/spreadsheets/u/0/create","_blank");
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(tsv).then(()=>{toast("コピー完了→開いたシートでCtrl+V");open();},()=>{open();toast("シートを開きました");});
      else{open();toast("シートを開きました");}
    },
    url(){
      try{
        const link=location.origin+location.pathname+"#z="+shareData();
        if(navigator.clipboard&&navigator.clipboard.writeText)
          navigator.clipboard.writeText(link).then(()=>toast("URLをコピーしました"),()=>prompt("このURLをコピーしてください",link));
        else prompt("このURLをコピーしてください",link);
      }catch(e){toast("URLの作成に失敗しました");}
    }
  };
  $("#fileIn").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s||(!s.timelines&&!s.blocks))throw 0;state=normalize(s);selId=null;persist();render();toast("読み込みました");}catch(err){toast("読み込みに失敗しました");}};
    rd.readAsText(f); e.target.value="";
  });

  // ---------------- keyboard ----------------
  document.addEventListener("keydown",e=>{
    if(viewMode)return;                              // 閲覧専用: ショートカット無効
    const ed=document.activeElement;
    if(ed&&(ed.isContentEditable||ed.tagName==="INPUT"||ed.tagName==="TEXTAREA"))return;
    const ctrl=e.ctrlKey||e.metaKey;
    const code=e.code||"";
    const isKey=k=>code==="Key"+k.toUpperCase()||(e.key||"").toLowerCase()===k; // 日本語入力(IME)中もCtrlショートカットを確実に拾う
    if(ctrl&&isKey("z")&&!e.shiftKey){e.preventDefault();undo();return;}
    if(ctrl&&(isKey("y")||(isKey("z")&&e.shiftKey))){e.preventDefault();redo();return;}
    if(ctrl&&isKey("c")){
      if(selId){const f=findCard(selId);if(f){clip={label:f.b.label,color:f.b.color,durMin:f.b.durMin,startMin:f.kind==="tl"?f.b.startMin:null,tlId:f.kind==="tl"?f.tl.id:null};toast("コピーしました");}}
      return;
    }
    if(ctrl&&isKey("v")){if(clip){e.preventDefault();pasteClip();}return;}
    if(!selId)return; const f=findCard(selId); if(!f)return; const b=f.b;
    if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();removeCard(selId);}
    else if(ctrl&&isKey("d")){e.preventDefault();duplicate(selId);}
    else if(f.kind==="tl"&&e.key==="ArrowUp"){e.preventDefault();b.startMin=clamp(b.startMin-state.scale,state.startMin,state.endMin-b.durMin);persist();render();checkOverlapPrompt(b.id);}
    else if(f.kind==="tl"&&e.key==="ArrowDown"){e.preventDefault();b.startMin=clamp(b.startMin+state.scale,state.startMin,state.endMin-b.durMin);persist();render();checkOverlapPrompt(b.id);}
  });

  // ---------------- init ----------------
  if(!fromHash())load();
  lastCommitted=JSON.stringify(state);
  if(viewMode){document.body.classList.add("viewonly");ptitle.readOnly=true;}
  render();
})();
</script>
</body>
</html>
