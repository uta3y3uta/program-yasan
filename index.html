<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>プログラム屋さん</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234DABF7'/%3E%3Crect x='24' y='22' width='52' height='14' rx='7' fill='white'/%3E%3Crect x='24' y='43' width='40' height='14' rx='7' fill='white'/%3E%3Crect x='24' y='64' width='30' height='14' rx='7' fill='white'/%3E%3C/svg%3E" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#eef2f7; --panel:#ffffff; --ink:#2b3445; --muted:#8a94a6;
    --line:#e6eaf0; --hour:#c7d0dc; --accent:#4DABF7; --accent-d:#2f8de0;
    --shadow:0 6px 20px rgba(40,60,90,.10); --shadow-s:0 2px 6px rgba(40,60,90,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    -webkit-user-select:none; user-select:none; overflow:hidden;
  }
  /* ---------- Top bar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:60px; z-index:40;
    display:flex; align-items:center; gap:10px; padding:0 12px;
    background:var(--panel); box-shadow:var(--shadow); overflow-x:auto;
  }
  .brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; padding-right:4px; white-space:nowrap}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
  .brand .logo svg{width:18px;height:18px}
  .spacer{flex:1}
  .iconbtn{
    width:42px;height:42px;border:none;border-radius:12px;background:#f3f5f9;color:var(--ink);
    display:grid;place-items:center;cursor:pointer;transition:.15s; position:relative;flex:none;
  }
  .iconbtn:hover{background:#e9edf4}
  .iconbtn:active{transform:scale(.94)}
  .iconbtn.primary{background:var(--accent);color:#fff}
  .iconbtn.primary:hover{background:var(--accent-d)}
  .iconbtn svg{width:20px;height:20px}
  .seg{display:flex;background:#f3f5f9;border-radius:12px;padding:4px;gap:2px;flex:none}
  .seg button{
    border:none;background:transparent;color:var(--muted);font-weight:700;font-size:13px;
    min-width:38px;height:34px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:2px
  }
  .seg button .u{font-size:10px;font-weight:600;opacity:.8}
  .seg button.active{background:#fff;color:var(--accent-d);box-shadow:var(--shadow-s)}

  .zoom{display:flex;align-items:center;gap:6px;background:#f3f5f9;border-radius:12px;padding:0 8px;height:42px;flex:none}
  .zoom button{border:none;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:4px}
  .zoom button:hover{color:var(--accent-d)}
  .zoom button svg{width:17px;height:17px}
  .zoom input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:6px;border-radius:6px;background:#d8deea;outline:none}
  .zoom input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:var(--shadow-s)}
  .zoom input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}

  .tip{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);background:#2b3445;color:#fff;font-size:11px;
    padding:3px 7px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;font-weight:600;z-index:5}
  .iconbtn:hover .tip{opacity:.96}

  /* ---------- Layout ---------- */
  .workspace{position:fixed;top:60px;left:0;right:0;bottom:0;display:flex}
  .palette{
    width:78px;background:var(--panel);box-shadow:var(--shadow);z-index:20;
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;overflow-y:auto;flex:none;
  }
  .palette .ph{font-size:11px;color:var(--muted);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
  .palette .ph svg{width:18px;height:18px}
  .swatch{
    width:48px;height:40px;border-radius:12px;cursor:grab;box-shadow:var(--shadow-s);
    touch-action:none;display:grid;place-items:center;color:rgba(0,0,0,.35);flex:none
  }
  .swatch:active{cursor:grabbing}
  .swatch svg{width:16px;height:16px;opacity:0;transition:.15s}
  .swatch:hover svg{opacity:.55}

  .stagewrap{flex:1;position:relative;overflow:auto;padding:18px 20px 40px}
  .titlebar{display:flex;align-items:center;gap:8px;margin:0 auto 14px;max-width:max-content}
  .ptitle{
    font-size:20px;font-weight:800;color:var(--ink);border:none;background:transparent;text-align:center;
    padding:6px 10px;border-radius:10px;min-width:240px;outline:none
  }
  .ptitle:focus{background:#fff;box-shadow:var(--shadow-s)}
  .ptitle::placeholder{color:#c2c9d4}

  .stage{margin:0 auto;width:max-content}
  .track{position:relative;display:flex;align-items:flex-start;gap:10px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:12px}

  .gutter{display:flex;flex-direction:column;flex:none;width:52px}
  .ghead{flex:none}
  .gbody{position:relative}
  .tick{position:absolute;right:6px;color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}

  .timeline{display:flex;flex-direction:column;flex:none;width:196px}
  .tl-head{display:flex;align-items:center;gap:4px;padding:0 2px 6px}
  .tl-name{flex:1;min-width:0;border:none;background:#f3f5f9;border-radius:9px;padding:6px 8px;font-size:13px;font-weight:800;color:var(--ink);outline:none;text-align:center}
  .tl-name:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
  .tl-name::placeholder{color:#b9c1ce}
  .tl-del{width:26px;height:30px;border:none;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}
  .tl-del:hover{background:#ffe3e3;color:#e03131}
  .tl-del svg{width:15px;height:15px}

  .lane{position:relative;border-radius:10px;background:#fbfcfe;touch-action:none}

  .block{
    position:absolute;left:5px;right:5px;border-radius:11px;box-shadow:var(--shadow-s);cursor:grab;
    border:2px solid rgba(255,255,255,.55);touch-action:none;overflow:visible
  }
  .block:active{cursor:grabbing}
  .block.sel{box-shadow:0 0 0 3px var(--accent),var(--shadow);z-index:5}
  .block .inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:5px 8px;gap:2px;overflow:hidden;border-radius:9px}
  .block .btime{font-size:10px;font-weight:800;opacity:.72;letter-spacing:.2px}
  .block .blabel{font-size:13px;font-weight:800;line-height:1.2;outline:none;overflow:hidden;flex:1;word-break:break-word;cursor:text}
  .block .blabel:empty:before{content:"やること";opacity:.45;font-weight:700}
  .block .handle{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);height:6px;width:38px;background:rgba(0,0,0,.18);border-radius:6px;cursor:ns-resize}
  .block:hover .handle{background:rgba(0,0,0,.3)}

  .actionbar{position:absolute;left:100%;top:0;margin-left:7px;display:flex;gap:4px;background:#fff;padding:5px;border-radius:12px;box-shadow:var(--shadow);z-index:8}
  .actionbar button{width:32px;height:32px;border:none;border-radius:9px;background:#f3f5f9;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
  .actionbar button:hover{background:#e9edf4}
  .actionbar button.del:hover{background:#ffe3e3;color:#e03131}
  .actionbar button svg{width:17px;height:17px}
  .swatchpop{position:absolute;left:100%;top:46px;margin-left:7px;display:flex;flex-wrap:wrap;gap:6px;width:140px;background:#fff;padding:8px;border-radius:12px;box-shadow:var(--shadow);z-index:9}
  .swatchpop b{width:24px;height:24px;border-radius:7px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}

  /* add-timeline tile */
  .addcol{display:flex;flex-direction:column;flex:none;width:60px}
  .addcol .sp{flex:none}
  .addbtn{flex:1;min-height:120px;border:2px dashed #cdd5e1;border-radius:12px;background:#fafbfd;color:#9aa4b4;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-weight:800;font-size:11px}
  .addbtn:hover{border-color:var(--accent);color:var(--accent-d);background:#f4f9ff}
  .addbtn svg{width:24px;height:24px}

  .hint{position:absolute;top:42%;left:0;right:0;margin:auto;width:max-content;color:var(--muted);font-weight:700;
    display:flex;align-items:center;gap:10px;font-size:14px;pointer-events:none}
  .hint svg{width:26px;height:26px}

  .ghostchip{position:fixed;z-index:60;width:72px;height:32px;border-radius:11px;box-shadow:var(--shadow);pointer-events:none;opacity:.92;display:grid;place-items:center;color:rgba(0,0,0,.4)}

  /* ---------- menus ---------- */
  .menu{position:fixed;top:64px;background:#fff;border-radius:14px;box-shadow:var(--shadow);z-index:50;padding:8px;min-width:230px;display:none}
  .menu.open{display:block;animation:pop .12s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .menu .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}
  .menu .row:hover{background:#f3f5f9}
  .menu .row svg{width:19px;height:19px;color:var(--accent-d)}
  .menu .sep{height:1px;background:var(--line);margin:6px 6px}
  .menu .ttl{font-size:11px;color:var(--muted);font-weight:800;padding:6px 12px 2px;letter-spacing:.4px}
  .settings .field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 12px}
  .settings label{font-weight:700;font-size:13px;color:var(--muted)}
  .settings input[type=time]{border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:14px;font-weight:700;color:var(--ink)}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#2b3445;color:#fff;
    padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* hide chrome for capture / print */
  body.capturing .no-capture{display:none !important}
  @media print{
    .topbar,.palette,.menu,.toast,.ghostchip,.hint,.actionbar,.swatchpop,.no-capture{display:none !important}
    body{overflow:visible;background:#fff}
    .workspace{position:static}
    .stagewrap{overflow:visible;padding:0}
    .track{box-shadow:none}
    .block.sel{box-shadow:var(--shadow-s) !important}
  }
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<div class="topbar">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 100 100"><rect x="22" y="20" width="56" height="13" rx="6.5" fill="#fff"/><rect x="22" y="43" width="42" height="13" rx="6.5" fill="#fff"/><rect x="22" y="66" width="30" height="13" rx="6.5" fill="#fff"/></svg></span>
    <span>プログラム屋さん</span>
  </div>

  <div class="spacer"></div>

  <!-- time range (clock) -->
  <button class="iconbtn" id="btnClock" aria-label="時間の範囲">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5"/><path d="M5 3 2.5 5.5"/><path d="M19 3l2.5 2.5"/></svg>
    <span class="tip">時間の範囲</span>
  </button>

  <!-- time scale -->
  <div class="seg" id="segScale">
    <button data-s="5"><span>5</span><span class="u">分</span></button>
    <button data-s="10"><span>10</span><span class="u">分</span></button>
    <button data-s="30"><span>30</span><span class="u">分</span></button>
    <button data-s="60"><span>60</span><span class="u">分</span></button>
  </div>

  <!-- zoom -->
  <div class="zoom">
    <button id="zOut" aria-label="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <input type="range" id="zoom" min="0.8" max="4" step="0.2" value="2" />
    <button id="zIn" aria-label="拡大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6"/><path d="M21 21l-4.3-4.3"/></svg></button>
  </div>

  <!-- output -->
  <button class="iconbtn" id="btnOut" aria-label="出力">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/></svg>
    <span class="tip">出力</span>
  </button>

  <!-- save -->
  <button class="iconbtn primary" id="btnSave" aria-label="保存">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
    <span class="tip">保存</span>
  </button>
</div>

<!-- ============ WORKSPACE ============ -->
<div class="workspace">
  <div class="palette" id="palette">
    <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17" cy="12" r="2.5"/><circle cx="6.5" cy="10.5" r="2.5"/><circle cx="9" cy="16" r="2.5"/><path d="M12 2a10 10 0 1 0 0 20 2 2 0 0 0 2-2 2 2 0 0 1 2-2h1a4 4 0 0 0 4-4 10 10 0 0 0-9-10z"/></svg>素材</div>
  </div>

  <div class="stagewrap" id="stagewrap">
    <div class="titlebar"><input class="ptitle" id="ptitle" placeholder="タイトルを入力" maxlength="60" /></div>
    <div class="stage" id="stage">
      <div class="track" id="track"></div>
    </div>
    <div class="hint" id="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M5 12l5-5M5 12l5 5"/></svg>
      左の色をカードにしてタイムラインへドラッグ
    </div>
  </div>
</div>

<!-- ============ OUTPUT MENU ============ -->
<div class="menu" id="outMenu">
  <div class="ttl">しゅつりょく</div>
  <div class="row" data-act="print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>印刷</div>
  <div class="row" data-act="pdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg>PDFで保存</div>
  <div class="row" data-act="jpeg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>JPEG出力</div>
  <div class="sep"></div>
  <div class="ttl">データ</div>
  <div class="row" data-act="jsonSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>JSON保存</div>
  <div class="row" data-act="jsonLoad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>JSON読み込み</div>
  <div class="row" data-act="excel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Excel出力</div>
  <div class="row" data-act="gsheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>Googleスプレッドシート</div>
  <div class="sep"></div>
  <div class="row" data-act="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>保存</div>
</div>

<!-- ============ SETTINGS ============ -->
<div class="menu settings" id="setMenu">
  <div class="ttl">ひょうじする じかん</div>
  <div class="field"><label>開始</label><input type="time" id="setStart" step="300" /></div>
  <div class="field"><label>終了</label><input type="time" id="setEnd" step="300" /></div>
</div>

<input type="file" id="fileIn" accept="application/json,.json" style="display:none" />
<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  const GUT=52, LANE_W=196, HEAD=38, TAIL=24, MAXTL=10;
  const KEY="program-yasan-v1";
  const COLORS=["#FF8787","#FFA94D","#FFD43B","#A9E34B","#69DB7C","#38D9A9","#4DABF7","#748FFC","#DA77F2","#F783AC","#CED4DA","#FFFFFF"];

  let state=defaultState();
  let selId=null;

  function defaultState(){return {title:"",scale:30,startMin:540,endMin:1080,ppm:2,timelines:[{id:"t1",name:"",blocks:[]}],seq:2};}

  const $=s=>document.querySelector(s);
  const track=$("#track"), hint=$("#hint"), palette=$("#palette"), ptitle=$("#ptitle"), toastEl=$("#toast");

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const snap=m=>Math.round(m/state.scale)*state.scale;
  function fmt(m){return Math.floor(m/60)+":"+String(m%60).padStart(2,"0");}
  function fmt2(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
  function parseTime(v){const[a,b]=v.split(":").map(Number);return a*60+b;}
  function lum(hex){const c=hex.replace("#","");return (0.299*parseInt(c.slice(0,2),16)+0.587*parseInt(c.slice(2,4),16)+0.114*parseInt(c.slice(4,6),16))/255;}
  function inkOn(hex){return lum(hex)>0.62?"#33405a":"#ffffff";}
  function uid(p){return p+(state.seq++)+Math.random().toString(36).slice(2,5);}
  function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove("show"),2200);}
  function safeName(){return (state.title||"プログラム").replace(/[\\\/:*?"<>|]/g,"_");}

  const posPx=m=>(m-state.startMin)*state.ppm;
  const laneLen=()=>(state.endMin-state.startMin)*state.ppm+TAIL;

  function locate(id){for(const tl of state.timelines){const i=tl.blocks.findIndex(b=>b.id===id);if(i>=0)return{tl,b:tl.blocks[i],i};}return null;}
  const blockEl=id=>track.querySelector('.block[data-id="'+id+'"]');

  function normalize(s){
    s=Object.assign(defaultState(),s||{});
    if(!Array.isArray(s.timelines)){
      if(Array.isArray(s.blocks))s.timelines=[{id:"t1",name:"",blocks:s.blocks}];
      else s.timelines=[{id:"t1",name:"",blocks:[]}];
    }
    delete s.blocks; delete s.orientation;
    s.timelines.forEach((tl,i)=>{if(!tl.id)tl.id="t"+(i+1);if(typeof tl.name!=="string")tl.name="";if(!Array.isArray(tl.blocks))tl.blocks=[];});
    if(!s.ppm)s.ppm=2;
    if([5,10,30,60].indexOf(s.scale)<0)s.scale=30;
    return s;
  }
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function load(){try{const r=localStorage.getItem(KEY);if(r)state=normalize(JSON.parse(r));}catch(e){}}

  // ---------------- render ----------------
  function render(){
    const L=laneLen();
    track.innerHTML="";
    // gutter
    const g=document.createElement("div"); g.className="gutter";
    const gh=document.createElement("div"); gh.className="ghead"; gh.style.height=HEAD+"px";
    const gb=document.createElement("div"); gb.className="gbody"; gb.style.height=L+"px";
    const sH=Math.ceil(state.startMin/60), eH=Math.floor(state.endMin/60);
    for(let h=sH;h<=eH;h++){const t=document.createElement("div");t.className="tick";t.textContent=fmt(h*60);t.style.top=(posPx(h*60)-7)+"px";gb.appendChild(t);}
    g.appendChild(gh); g.appendChild(gb); track.appendChild(g);

    // timelines
    state.timelines.forEach(tl=>{
      const col=document.createElement("div"); col.className="timeline";
      const head=document.createElement("div"); head.className="tl-head"; head.style.height=HEAD+"px";
      const nm=document.createElement("input"); nm.className="tl-name"; nm.placeholder="名称"; nm.value=tl.name||""; nm.maxLength=20;
      nm.addEventListener("input",()=>{tl.name=nm.value;persist();});
      nm.addEventListener("pointerdown",e=>e.stopPropagation());
      head.appendChild(nm);
      if(state.timelines.length>1){
        const del=document.createElement("button"); del.className="tl-del no-capture"; del.title="このタイムラインを削除";
        del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
        del.onclick=()=>deleteTimeline(tl.id);
        head.appendChild(del);
      }
      const lane=document.createElement("div"); lane.className="lane"; lane.dataset.tl=tl.id;
      lane.style.height=L+"px"; lane.style.width=(LANE_W-0)+"px";
      lane.style.backgroundImage=
        "repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px "+(state.scale*state.ppm)+"px),"+
        "repeating-linear-gradient(to bottom,var(--hour) 0 1px,transparent 1px "+(60*state.ppm)+"px)";
      lane.addEventListener("pointerdown",e=>{if(e.target===lane){selId=null;render();}});
      tl.blocks.forEach(b=>lane.appendChild(buildBlock(b)));
      col.appendChild(head); col.appendChild(lane); track.appendChild(col);
    });

    // add-timeline tile
    if(state.timelines.length<MAXTL){
      const ac=document.createElement("div"); ac.className="addcol no-capture";
      const sp=document.createElement("div"); sp.className="sp"; sp.style.height=HEAD+"px";
      const btn=document.createElement("div"); btn.className="addbtn"; btn.style.height=L+"px";
      btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>追加';
      btn.onclick=addTimeline;
      ac.appendChild(sp); ac.appendChild(btn); track.appendChild(ac);
    }

    const empty=state.timelines.every(t=>t.blocks.length===0);
    hint.style.display=empty?"flex":"none";
    ptitle.value=state.title;
    $("#zoom").value=state.ppm;
    [...document.querySelectorAll("#segScale button")].forEach(x=>x.classList.toggle("active",+x.dataset.s===state.scale));
  }

  function styleBlock(el,b){
    el.style.top=posPx(b.startMin)+"px";
    el.style.height=(b.durMin*state.ppm)+"px";
    el.style.background=b.color; el.style.color=inkOn(b.color);
    const tm=el.querySelector(".btime"); if(tm)tm.textContent=fmt(b.startMin)+"–"+fmt(b.startMin+b.durMin);
  }
  function buildBlock(b){
    const el=document.createElement("div"); el.className="block"+(b.id===selId?" sel":""); el.dataset.id=b.id;
    const inner=document.createElement("div"); inner.className="inner";
    const tm=document.createElement("div"); tm.className="btime";
    const lb=document.createElement("div"); lb.className="blabel"; lb.textContent=b.label||"";
    inner.appendChild(tm); inner.appendChild(lb); el.appendChild(inner);
    const h=document.createElement("div"); h.className="handle no-capture"; el.appendChild(h);
    styleBlock(el,b);
    if(b.id===selId) el.appendChild(buildActionBar(b));
    el.addEventListener("pointerdown",e=>onBlockDown(e,b));
    h.addEventListener("pointerdown",e=>onHandleDown(e,b));
    lb.addEventListener("dblclick",e=>{e.stopPropagation();startEdit(lb,b);});
    return el;
  }
  function buildActionBar(b){
    const bar=document.createElement("div"); bar.className="actionbar no-capture";
    bar.addEventListener("pointerdown",e=>e.stopPropagation());
    const mk=(svg,cls,fn)=>{const x=document.createElement("button");x.className=cls||"";x.innerHTML=svg;x.onclick=ev=>{ev.stopPropagation();fn();};return x;};
    bar.appendChild(mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.6"/><circle cx="17" cy="12" r="1.6"/><circle cx="7" cy="10" r="1.6"/><circle cx="9.5" cy="16" r="1.6"/><path d="M12 2a10 10 0 1 0 0 20 2 2 0 0 0 2-2 2 2 0 0 1 2-2h1a4 4 0 0 0 4-4 10 10 0 0 0-9-10z"/></svg>',"",()=>toggleSwatch(b)));
    bar.appendChild(mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',"",()=>duplicate(b)));
    bar.appendChild(mk('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',"del",()=>removeBlock(b.id)));
    return bar;
  }
  function toggleSwatch(b){
    const ex=track.querySelector(".swatchpop"); if(ex){ex.remove();return;}
    const el=blockEl(b.id); if(!el)return;
    const pop=document.createElement("div"); pop.className="swatchpop no-capture";
    pop.addEventListener("pointerdown",e=>e.stopPropagation());
    COLORS.forEach(c=>{const s=document.createElement("b");s.style.background=c;s.onclick=ev=>{ev.stopPropagation();b.color=c;persist();render();};pop.appendChild(s);});
    el.appendChild(pop);
  }

  // ---------------- editing ----------------
  function startEdit(lb,b){
    if(lb.isContentEditable)return;
    lb.contentEditable="true"; lb.focus();
    const r=document.createRange(); r.selectNodeContents(lb);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    const done=()=>{lb.contentEditable="false";b.label=lb.textContent.trim();persist();render();};
    lb.addEventListener("blur",done,{once:true});
    lb.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();lb.blur();}if(e.key==="Escape"){e.preventDefault();lb.blur();}});
  }

  // ---------------- block ops ----------------
  function addBlock(tlId,startMin,color){
    const tl=state.timelines.find(t=>t.id===tlId); if(!tl)return;
    const def=Math.max(state.scale,Math.ceil(30/state.scale)*state.scale);
    const s=clamp(snap(startMin),state.startMin,state.endMin-state.scale);
    const d=Math.min(def,state.endMin-s);
    const b={id:uid("b"),startMin:s,durMin:d,label:"",color:color||"#4DABF7"};
    tl.blocks.push(b); selId=b.id; persist(); render();
  }
  function duplicate(b){
    const loc=locate(b.id); if(!loc)return;
    const nb=Object.assign({},b,{id:uid("b")});
    nb.startMin=clamp(nb.startMin+nb.durMin,state.startMin,state.endMin-nb.durMin);
    loc.tl.blocks.push(nb); selId=nb.id; persist(); render();
  }
  function removeBlock(id){const loc=locate(id);if(!loc)return;loc.tl.blocks.splice(loc.i,1);if(selId===id)selId=null;persist();render();}
  function reassign(id,tlId){const loc=locate(id);const tgt=state.timelines.find(t=>t.id===tlId);if(!loc||!tgt||tgt===loc.tl)return;loc.tl.blocks.splice(loc.i,1);tgt.blocks.push(loc.b);}
  function select(id){selId=id;render();}

  function addTimeline(){
    if(state.timelines.length>=MAXTL){toast("タイムラインは最大"+MAXTL+"個までです");return;}
    state.timelines.push({id:uid("t"),name:"",blocks:[]}); persist(); render();
  }
  function deleteTimeline(id){
    if(state.timelines.length<=1){toast("タイムラインは1つ必要です");return;}
    const tl=state.timelines.find(t=>t.id===id); if(!tl)return;
    if(tl.blocks.length && !confirm("このタイムラインとカードを削除しますか？"))return;
    state.timelines=state.timelines.filter(t=>t.id!==id);
    if(selId&&!locate(selId))selId=null;
    persist(); render();
  }

  // ---------------- helpers: lane geometry ----------------
  function laneAtPoint(x,y){
    for(const lane of track.querySelectorAll(".lane")){
      const r=lane.getBoundingClientRect();
      if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return{tlId:lane.dataset.tl,rect:r,el:lane};
    }
    return null;
  }
  const minAt=(y,top)=>state.startMin+(y-top)/state.ppm;

  // ---------------- pointer: create from palette ----------------
  function onSwatchDown(e,color){
    e.preventDefault();
    const chip=document.createElement("div"); chip.className="ghostchip"; chip.style.background=color; chip.style.color=inkOn(color);
    chip.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    document.body.appendChild(chip);
    const move=ev=>{chip.style.left=(ev.clientX-36)+"px";chip.style.top=(ev.clientY-16)+"px";}; move(e);
    const up=ev=>{
      window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up); chip.remove();
      const t=laneAtPoint(ev.clientX,ev.clientY);
      if(t)addBlock(t.tlId,minAt(ev.clientY,t.rect.top),color);
    };
    window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
  }

  // ---------------- pointer: move / tap-to-edit ----------------
  function onBlockDown(e,b){
    if(e.target.classList.contains("handle"))return;
    if(e.target.classList.contains("blabel")&&e.target.isContentEditable)return;
    e.preventDefault();
    select(b.id);
    const sx=e.clientX, sy=e.clientY;
    const laneTop=blockEl(b.id).closest(".lane").getBoundingClientRect().top;
    const grab=minAt(sy,laneTop)-b.startMin;
    let moving=false;
    const move=ev=>{
      if(!moving && Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<5)return;
      moving=true;
      let ns=snap(minAt(ev.clientY,laneTop)-grab);
      ns=clamp(ns,state.startMin,state.endMin-b.durMin);
      b.startMin=ns; const el=blockEl(b.id); if(el)styleBlock(el,b);
    };
    const up=ev=>{
      window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up);
      if(moving){
        const t=laneAtPoint(ev.clientX,ev.clientY);
        if(t)reassign(b.id,t.tlId);
        persist(); render();
      }else{
        const lb=blockEl(b.id).querySelector(".blabel"); startEdit(lb,b);
      }
    };
    window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
  }

  // ---------------- pointer: resize ----------------
  function onHandleDown(e,b){
    e.preventDefault(); e.stopPropagation(); select(b.id);
    const laneTop=blockEl(b.id).closest(".lane").getBoundingClientRect().top;
    const move=ev=>{
      let nd=snap(minAt(ev.clientY,laneTop)-b.startMin);
      nd=clamp(nd,state.scale,state.endMin-b.startMin);
      b.durMin=nd; const el=blockEl(b.id); if(el)styleBlock(el,b);
    };
    const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);persist();render();};
    window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
  }

  // ---------------- palette ----------------
  COLORS.forEach(c=>{
    const s=document.createElement("div"); s.className="swatch"; s.style.background=c; s.style.color=inkOn(c);
    s.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    s.addEventListener("pointerdown",e=>onSwatchDown(e,c));
    palette.appendChild(s);
  });

  // ---------------- toolbar ----------------
  $("#segScale").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state.scale=+b.dataset.s;persist();render();});
  ptitle.addEventListener("input",()=>{state.title=ptitle.value;persist();});
  $("#zoom").addEventListener("input",e=>{state.ppm=+e.target.value;persist();render();});
  $("#zOut").onclick=()=>{state.ppm=clamp(Math.round((state.ppm-0.4)*10)/10,0.8,4);persist();render();};
  $("#zIn").onclick=()=>{state.ppm=clamp(Math.round((state.ppm+0.4)*10)/10,0.8,4);persist();render();};

  const outMenu=$("#outMenu"), setMenu=$("#setMenu");
  function closeMenus(){outMenu.classList.remove("open");setMenu.classList.remove("open");}
  function openMenu(menu,btn){
    closeMenus(); const r=btn.getBoundingClientRect();
    menu.style.top=(r.bottom+6)+"px"; menu.style.right="auto"; menu.classList.add("open");
    let left=Math.min(r.left, window.innerWidth-menu.offsetWidth-10); left=Math.max(10,left);
    menu.style.left=left+"px";
  }
  $("#btnOut").onclick=e=>{e.stopPropagation();outMenu.classList.contains("open")?closeMenus():openMenu(outMenu,e.currentTarget);};
  $("#btnClock").onclick=e=>{e.stopPropagation();
    if(setMenu.classList.contains("open")){closeMenus();return;}
    $("#setStart").value=fmt2(state.startMin); $("#setEnd").value=fmt2(state.endMin); openMenu(setMenu,e.currentTarget);};
  document.addEventListener("click",closeMenus);
  outMenu.addEventListener("click",e=>e.stopPropagation());
  setMenu.addEventListener("click",e=>e.stopPropagation());
  $("#setStart").addEventListener("change",e=>{const v=parseTime(e.target.value);if(v<state.endMin){state.startMin=v;persist();render();}});
  $("#setEnd").addEventListener("change",e=>{const v=parseTime(e.target.value);if(v>state.startMin){state.endMin=v;persist();render();}});
  $("#btnSave").onclick=()=>{persist();toast("保存しました");};

  // ---------------- output ----------------
  outMenu.addEventListener("click",e=>{const r=e.target.closest(".row");if(!r)return;closeMenus();ACT[r.dataset.act]&&ACT[r.dataset.act]();});
  const HEAD_ROW=["タイムライン","開始","終了","所要(分)","やること"];
  function rows(){
    const out=[];
    state.timelines.forEach(tl=>{
      tl.blocks.slice().sort((a,b)=>a.startMin-b.startMin).forEach(b=>{
        out.push({"タイムライン":tl.name||"","開始":fmt(b.startMin),"終了":fmt(b.startMin+b.durMin),"所要(分)":b.durMin,"やること":b.label||""});
      });
    });
    return out;
  }
  function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
  async function captureCanvas(){
    const keep=selId; selId=null; render();
    const pop=track.querySelector(".swatchpop"); if(pop)pop.remove();
    document.body.classList.add("capturing");
    await new Promise(r=>requestAnimationFrame(r));
    const canvas=await html2canvas(track,{scale:2,backgroundColor:"#ffffff",logging:false});
    document.body.classList.remove("capturing"); selId=keep; render();
    return canvas;
  }
  const ACT={
    save(){persist();toast("保存しました");},
    print(){window.print();},
    async pdf(){
      if(!window.jspdf){toast("PDFライブラリ未読込");return;}
      toast("PDFを作成中…");
      const canvas=await captureCanvas();
      const img=canvas.toDataURL("image/jpeg",0.95);
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:canvas.width>canvas.height?"l":"p",unit:"pt",format:"a4"});
      const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=28;
      const ratio=Math.min((pw-m*2)/canvas.width,(ph-m*2)/canvas.height);
      pdf.addImage(img,"JPEG",(pw-canvas.width*ratio)/2,m,canvas.width*ratio,canvas.height*ratio);
      pdf.save(safeName()+".pdf");
    },
    async jpeg(){toast("画像を書き出し中…");const canvas=await captureCanvas();canvas.toBlob(b=>download(b,safeName()+".jpg"),"image/jpeg",0.95);},
    jsonSave(){download(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),safeName()+".json");toast("JSONを保存しました");},
    jsonLoad(){$("#fileIn").click();},
    excel(){
      if(!window.XLSX){toast("Excelライブラリ未読込");return;}
      const ws=XLSX.utils.json_to_sheet(rows(),{header:HEAD_ROW});
      ws["!cols"]=[{wch:14},{wch:8},{wch:8},{wch:9},{wch:40}];
      const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"プログラム");
      XLSX.writeFile(wb,safeName()+".xlsx"); toast("Excelを出力しました");
    },
    gsheet(){
      const tsv=[HEAD_ROW.join("\t")].concat(rows().map(r=>HEAD_ROW.map(h=>r[h]).join("\t"))).join("\n");
      const open=()=>window.open("https://docs.google.com/spreadsheets/u/0/create","_blank");
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(tsv).then(()=>{toast("コピー完了→開いたシートでCtrl+V");open();},()=>{open();toast("シートを開きました");});
      else{open();toast("シートを開きました");}
    }
  };
  $("#fileIn").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!s||(!s.timelines&&!s.blocks))throw 0;state=normalize(s);selId=null;persist();render();toast("読み込みました");}catch(err){toast("読み込みに失敗しました");}};
    rd.readAsText(f); e.target.value="";
  });

  // ---------------- keyboard ----------------
  document.addEventListener("keydown",e=>{
    const ed=document.activeElement;
    if(ed&&(ed.isContentEditable||ed.tagName==="INPUT"))return;
    if(!selId)return; const loc=locate(selId); if(!loc)return; const b=loc.b;
    if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();removeBlock(selId);}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="d"){e.preventDefault();duplicate(b);}
    else if(e.key==="ArrowUp"){e.preventDefault();b.startMin=clamp(b.startMin-state.scale,state.startMin,state.endMin-b.durMin);persist();render();}
    else if(e.key==="ArrowDown"){e.preventDefault();b.startMin=clamp(b.startMin+state.scale,state.startMin,state.endMin-b.durMin);persist();render();}
  });

  // ---------------- init ----------------
  load(); render();
})();
</script>
</body>
</html>
